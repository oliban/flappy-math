<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <meta name="theme-color" content="#5DB7F5">
  <title>Flappy Matte</title>
  <meta name="description" content="Öva multiplikation genom att flyga genom rätt svar. Dagens tabell, 290+ figurer att låsa upp, topplista och riktigt väder.">
  <link rel="canonical" href="https://flappy-math.fly.dev/">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Social previews (Open Graph + Twitter cards) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Flappy Matte">
  <meta property="og:title" content="Flappy Matte – öva multiplikation på ett kul sätt">
  <meta property="og:description" content="Flyg genom rätt svar! Dagens tabell, 290+ figurer att låsa upp, topplista och vädret där du är.">
  <meta property="og:url" content="https://flappy-math.fly.dev/">
  <meta property="og:image" content="https://flappy-math.fly.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Flappy Matte: en räv flyger mot rör med svarsalternativ till 8 × 7">
  <meta property="og:locale" content="sv_SE">
  <meta property="og:locale:alternate" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Flappy Matte – öva multiplikation på ett kul sätt">
  <meta name="twitter:description" content="Flyg genom rätt svar! Dagens tabell, 290+ figurer, topplista och vädret där du är.">
  <meta name="twitter:image" content="https://flappy-math.fly.dev/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Player profile overlay (HTML so the keyboard works on phones and tablets) -->
    <div id="profile-overlay" class="overlay" hidden>
      <form id="profile-form" class="profile-card" autocomplete="off">
        <h1 id="profile-title">Vem spelar?</h1>
        <label class="field">
          <span id="profile-name-label">Ditt namn</span>
          <input id="profile-name" type="text" maxlength="12" inputmode="text" autocapitalize="words" enterkeyhint="done" required>
        </label>
        <p id="profile-avatar-label" class="section-label">Välj din figur</p>
        <div id="avatar-grid" class="avatar-grid" role="radiogroup"></div>
        <p id="avatar-selected-name" class="avatar-selected-name" aria-live="polite"></p>
        <div class="profile-actions">
          <button type="button" id="profile-back" class="btn btn-ghost" hidden>Tillbaka</button>
          <button type="submit" id="profile-submit" class="btn btn-primary">Kör!</button>
        </div>
      </form>
    </div>
  </div>

  <div id="portrait-warning">
    <div class="rotate-icon">📱</div>
    <h2 id="rotate-title">Vänd på enheten</h2>
    <p id="rotate-body">Vänd till liggande läge för att spela</p>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
