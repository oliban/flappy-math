<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <meta name="theme-color" content="#1a1a2e">
  <title>Flappy Math</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="name-dialog" class="hidden">
    <div class="dialog-card">
      <h2 id="name-dialog-title">Your name</h2>
      <p id="name-dialog-hint">Shown on the global highscore list</p>
      <input id="name-input" type="text" maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="dialog-buttons">
        <button id="name-cancel" type="button">Cancel</button>
        <button id="name-save" type="button">Save</button>
      </div>
    </div>
  </div>

  <div id="location-dialog" class="hidden">
    <div class="dialog-card">
      <h2 id="location-dialog-title">Weather location</h2>
      <p id="location-dialog-hint">Search for a place, or use where you are</p>
      <div class="dialog-row">
        <input id="location-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="location-search" type="button">Search</button>
      </div>
      <p id="location-status" class="dialog-status"></p>
      <ul id="location-results"></ul>
      <div class="dialog-buttons">
        <button id="location-mine" type="button">Use my location</button>
        <button id="location-default" type="button">Use Mölndal</button>
      </div>
      <button id="location-close" type="button" class="dialog-close">Close</button>
    </div>
  </div>

  <div id="portrait-warning">
    <div class="rotate-icon">📱</div>
    <h2>Rotate Your Device</h2>
    <p>Please rotate to landscape mode to play</p>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
